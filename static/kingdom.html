<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Kingdom</title>
<link rel="stylesheet" href="/static/kingdom.css">
</head>
<body class="map">
<canvas id="world" aria-label="Map of the Kingdom. Use the Places list to move around without a mouse."></canvas>

<header class="bar">
  <a class="crest" href="/kingdom" aria-label="The Kingdom - home"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 26V12l5 4 6-9 6 9 5-4v14z" /><circle cx="16" cy="20" r="2.6"/></svg><span>The Kingdom</span></a>
  <button class="clock" id="clockWork" data-clock="work" aria-haspopup="dialog"><b>Work</b><span class="t"></span><span class="n"></span></button>
  <button class="clock" id="clockPersonal" data-clock="personal" aria-haspopup="dialog"><b>Personal</b><span class="t"></span><span class="n"></span></button>
  <button class="jump" id="jumpBtn" aria-keyshortcuts="/"><span>Go to a place, person or task</span><kbd>/</kbd></button>
</header>

<nav class="rail" id="rail" aria-label="Places"></nav>

<aside class="panel" id="panel" hidden aria-live="polite">
  <button class="close" id="panelClose" aria-label="Close">×</button>
  <div id="panelBody"></div>
</aside>

<section class="since" id="since" hidden aria-label="Since your last visit"></section>

<div class="jumpbox" id="jumpbox" hidden role="dialog" aria-label="Go to">
  <input id="jumpInput" placeholder="Type a place, an agent, a project, a task or anything in the library" autocomplete="off">
  <ul id="jumpList" role="listbox"></ul>
</div>

<div class="hint" id="hint">Drag to look around · scroll to zoom · Q / E to turn · click a building, a person or a courier</div>
<div class="nogl" id="nogl" hidden>This browser can't draw the town (WebGL is off). The <a href="/kingdom/places">list of places</a> has everything the map shows.</div>

<script type="module">
import * as THREE from "/static/three.min.js";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function hash(s){ let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; }
function rng(seed){ let x = Math.floor(seed * 2147483647) || 1; return () => (x = x * 16807 % 2147483647) / 2147483647; }

/* ---------------------------------------------------------------- palette (sandstone town) */
const C = {
  sand: "#d9bd90", sandDark: "#b8946a", sandLight: "#ecd9b5", grass: "#8aa564", grassDark: "#6b8a4b", hedge: "#55743f",
  slate: "#566a78", slateDark: "#3f5260", verdigris: "#5f9e8c", brick: "#b0684f", timber: "#8a6446", plaster: "#efe2c9",
  glass: "#a9c4cc", lamp: "#ffc25f", water: "#7fb2c0", path: "#cdb187", ink: "#1d2630",
};
const AGENT_COLORS = ["#f2b65a", "#7fc4e8", "#b79ce8", "#8fd9b0", "#ef9aa9", "#e8d57a"];

/* ---------------------------------------------------------------- renderer */
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas: $("world"), antialias: true }); }
catch (e) { $("nogl").hidden = false; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const VIEW = 46;
const aspect = () => innerWidth / innerHeight;
const camera = new THREE.OrthographicCamera(-VIEW * aspect() / 2, VIEW * aspect() / 2, VIEW / 2, -VIEW / 2, -200, 400);
const target = new THREE.Vector3(0, 0, -1);
let yaw = Math.PI / 4, yawGoal = yaw;
function placeCamera() {
  const d = 60;
  camera.position.set(target.x + Math.sin(yaw) * d, target.y + d * 0.82, target.z + Math.cos(yaw) * d);
  camera.lookAt(target);
}
placeCamera();

const hemi = new THREE.HemisphereLight("#fff1d6", "#6d7f5a", 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight("#fff0d2", 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -48, right: 48, top: 48, bottom: -48, near: 1, far: 200 });
sun.shadow.bias = -0.0006;
scene.add(sun, sun.target);

/* ---------------------------------------------------------------- materials (flat, softly varied = painted) */
const mats = new Map();
function mat(color, opts = {}) {
  const k = color + JSON.stringify(opts);
  if (!mats.has(k)) mats.set(k, new THREE.MeshStandardMaterial({ color, roughness: 0.92, metalness: 0, flatShading: true, ...opts }));
  return mats.get(k);
}
function paint(geo, color, amount = 0.06, seed = 1) {   // per-face colour variation: the "brush"
  geo = geo.index ? geo.toNonIndexed() : geo;
  const base = new THREE.Color(color), col = [], r = rng(seed);
  const n = geo.attributes.position.count;
  for (let i = 0; i < n; i += 3) {
    const v = 1 + (r() - 0.5) * amount * 2, c = base.clone().multiplyScalar(v);
    for (let j = 0; j < 3; j++) col.push(c.r, c.g, c.b);
  }
  geo.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  return geo;
}
const vmat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, flatShading: true });
function box(w, h, d, color, x = 0, y = 0, z = 0, seed = 1, amount = 0.05) {
  const m = new THREE.Mesh(paint(new THREE.BoxGeometry(w, h, d), color, amount, seed), vmat);
  m.position.set(x, y + h / 2, z); m.castShadow = m.receiveShadow = true; return m;
}
function prism(w, h, d, color, x = 0, y = 0, z = 0, seed = 2) {      // a pitched roof along x
  const s = new THREE.Shape(); s.moveTo(-d / 2, 0); s.lineTo(d / 2, 0); s.lineTo(0, h); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: w, bevelEnabled: false }); g.rotateY(Math.PI / 2); g.translate(-w / 2, 0, 0);
  const m = new THREE.Mesh(paint(g, color, 0.06, seed), vmat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; return m;
}
function cyl(r1, r2, h, color, x = 0, y = 0, z = 0, seg = 10, seed = 3) {
  const m = new THREE.Mesh(paint(new THREE.CylinderGeometry(r1, r2, h, seg), color, 0.05, seed), vmat);
  m.position.set(x, y + h / 2, z); m.castShadow = m.receiveShadow = true; return m;
}
function tree(x, z, s = 1, seed = 1) {
  const g = new THREE.Group(), r = rng(seed);
  g.add(cyl(0.12 * s, 0.16 * s, 0.9 * s, C.timber, 0, 0, 0, 6, seed));
  const leaf = r() > 0.5 ? C.grassDark : C.hedge;
  const top = new THREE.Mesh(paint(new THREE.IcosahedronGeometry(0.75 * s, 0), leaf, 0.12, seed), vmat);
  top.position.y = 1.35 * s; top.castShadow = true; top.rotation.set(r(), r(), r()); g.add(top);
  if (r() > 0.4) { const t2 = top.clone(); t2.scale.setScalar(0.65); t2.position.set(0.4 * s, 1.0 * s, 0.25 * s); g.add(t2); }
  g.position.set(x, 0, z); return g;
}

/* ---------------------------------------------------------------- ground, square, paths */
const ground = new THREE.Mesh(paint(new THREE.CircleGeometry(70, 56).rotateX(-Math.PI / 2), C.grass, 0.05, 9), vmat);
ground.receiveShadow = true; scene.add(ground);
{ // the square: a ring of sandstone flags
  const g = new THREE.Group(), r = rng(0.7);
  for (let ring = 0; ring < 6; ring++) {
    const n = 8 + ring * 7, rad = 1.1 + ring * 1.05;
    for (let i = 0; i < n; i++) {
      const a = (i + (ring % 2) * 0.5) / n * Math.PI * 2, tile = box(1.0, 0.08, 0.95, r() > 0.5 ? C.sand : C.sandLight, 0, 0, 0, r(), 0.04);
      tile.position.set(Math.cos(a) * rad, 0.0, Math.sin(a) * rad); tile.rotation.y = -a; tile.castShadow = false; g.add(tile);
    }
  }
  scene.add(g);
}
const paths = new THREE.Group(); scene.add(paths);
function path(ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az, len = Math.hypot(dx, dz), steps = Math.ceil(len / 1.1);
  for (let i = 0; i < steps; i++) {
    const t = (i + 0.5) / steps, s = box(1.3, 0.06, 1.0, i % 3 ? C.path : C.sand, ax + dx * t, 0, az + dz * t, hash(ax + "," + i), 0.05);
    s.rotation.y = Math.atan2(dx, dz); s.castShadow = false; paths.add(s);
  }
}

/* ---------------------------------------------------------------- clock tower (Work / Personal faces) */
function faceTexture() { const c = document.createElement("canvas"); c.width = 256; c.height = 256; const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return [c, t]; }
const faces = {};
{
  const g = new THREE.Group();
  g.add(cyl(1.5, 1.8, 0.5, C.sandDark, 0, 0, 0, 12, 4));
  const basin = cyl(1.35, 1.35, 0.25, C.water, 0, 0.45, 0, 16, 5); basin.material = mat(C.water, { roughness: 0.3 }); g.add(basin);
  g.add(box(1.1, 4.6, 1.1, C.sand, 0, 0.5, 0, 6));
  g.add(prism(1.3, 0.9, 1.3, C.verdigris, 0, 5.1, 0, 7));
  for (const [key, ang] of [["work", Math.PI / 4], ["personal", -Math.PI * 3 / 4]]) {
    const [cv, tex] = faceTexture();
    const f = new THREE.Mesh(new THREE.CircleGeometry(0.46, 32), new THREE.MeshBasicMaterial({ map: tex }));
    const dir = new THREE.Vector3(Math.sin(ang), 0, Math.cos(ang));
    f.position.set(dir.x * 0.79, 4.25, dir.z * 0.79);
    f.lookAt(dir.x * 5, 4.25, dir.z * 5);
    f.userData = { kind: "clock", id: key };
    g.add(f); faces[key] = { cv, tex, mesh: f };
  }
  g.userData = { kind: "clock", id: "work" };
  scene.add(g);
}
function drawFace(key, label, timeTxt, nextTxt) {
  const { cv, tex } = faces[key], x = cv.getContext("2d");
  x.clearRect(0, 0, 256, 256);
  x.fillStyle = key === "work" ? "#f3e8d3" : "#f6e3cf"; x.beginPath(); x.arc(128, 128, 124, 0, 7); x.fill();
  x.lineWidth = 8; x.strokeStyle = "#3f5260"; x.stroke();
  const now = new Date(), h = now.getHours() % 12, m = now.getMinutes();
  x.strokeStyle = "#1d2630"; x.lineCap = "round";
  for (const [a, len, w] of [[(h + m / 60) / 12, 58, 9], [m / 60, 86, 6]]) {
    x.lineWidth = w; x.beginPath(); x.moveTo(128, 128); x.lineTo(128 + Math.sin(a * 6.283) * len, 128 - Math.cos(a * 6.283) * len); x.stroke();
  }
  x.fillStyle = "#3f5260"; x.font = "600 26px 'Palatino Linotype', Palatino, 'Book Antiqua', serif"; x.textAlign = "center";
  x.fillText(label, 128, 78);
  if (nextTxt) { x.fillStyle = key === "work" ? "#3f7f70" : "#9b5a3c"; x.beginPath(); x.arc(128, 196, 10, 0, 7); x.fill(); }
  tex.needsUpdate = true;
}

/* ---------------------------------------------------------------- buildings */
const PICK = [];               // meshes you can click
const BUILD = {};              // place id -> { group, windows[], door, lightBulbs[] }
function windowsRow(g, list, n, w, y, z, x0, gap, rotY = 0, size = [0.55, 0.75]) {
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(size[0], size[1]), new THREE.MeshStandardMaterial({ color: C.glass, emissive: C.lamp, emissiveIntensity: 0, roughness: 0.4 }));
    const x = x0 + i * gap;
    if (rotY) { m.position.set(z, y, x); m.rotation.y = rotY; } else m.position.set(x, y, z);
    g.add(m); list.push(m);
  }
}
function door(g, x, z, w = 0.9, h = 1.5, color = C.timber, rotY = 0) {
  const d = box(w, h, 0.12, color, x, 0.15, z, 11); d.rotation.y = rotY; g.add(d);
}
function roofGarden(g, x, y, z, w, d, seed) {
  const r = rng(seed);
  g.add(box(w, 0.25, d, C.hedge, x, y, z, seed, 0.12));
  for (let i = 0; i < Math.max(2, w * d / 3); i++) {
    const p = new THREE.Mesh(paint(new THREE.IcosahedronGeometry(0.22 + r() * 0.2, 0), r() > .5 ? C.grassDark : C.grass, 0.12, r()), vmat);
    p.position.set(x + (r() - 0.5) * (w - 0.4), y + 0.4, z + (r() - 0.5) * (d - 0.4)); p.castShadow = true; g.add(p);
  }
}

const builders = {
  library(g, w) {
    g.add(box(10, 0.5, 6.5, C.sandDark, 0, 0, 0, 1));
    g.add(box(9, 3.4, 5.5, C.sand, 0, 0.5, 0, 2));
    g.add(box(9.4, 0.4, 5.9, C.sandLight, 0, 3.9, 0, 3));
    for (let i = 0; i < 7; i++) g.add(cyl(0.22, 0.26, 3.3, C.sandLight, -3.9 + i * 1.3, 0.5, 3.1, 10, 4 + i));
    g.add(box(9.6, 0.5, 1.1, C.sandLight, 0, 3.8, 3.1, 5));
    const dome = new THREE.Mesh(paint(new THREE.SphereGeometry(2.1, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2), C.verdigris, 0.07, 6), vmat);
    dome.position.set(0, 4.3, -0.3); dome.castShadow = true; g.add(dome);
    g.add(cyl(0.25, 0.25, 0.8, C.sandLight, 0, 6.3, -0.3, 8, 7));
    windowsRow(g, w, 6, 0, 2.2, 2.78, -3.25, 1.3, 0, [0.6, 1.4]);
    for (let s = 0; s < 3; s++) g.add(box(3.4 - s * 0.6, 0.18, 0.6, C.sandLight, 0, 0.5 - (s + 1) * 0.16, 3.6 + s * 0.45, 8 + s));
    door(g, 0, 2.85, 1.2, 2.2, C.timber);
    roofGarden(g, -3.4, 4.3, -1.6, 2.2, 1.6, 12); roofGarden(g, 3.4, 4.3, -1.6, 2.2, 1.6, 13);
    return [0, 4.4];
  },
  studio(g, w) {
    g.add(box(8.4, 3.2, 5.2, C.brick, 0, 0, 0, 21, 0.08));
    for (let i = 0; i < 4; i++) { const p = prism(5.2, 1.2, 2.1, i % 2 ? C.slate : C.slateDark, -3.15 + i * 2.1, 3.2, 0, 22 + i); p.rotation.y = Math.PI / 2; g.add(p); }
    g.add(cyl(0.35, 0.42, 3.2, C.brick, 3.4, 3.2, -1.9, 8, 26));
    windowsRow(g, w, 5, 0, 1.6, 2.62, -3.2, 1.6, 0, [1.0, 1.4]);
    door(g, 0, 2.66, 1.6, 2.2, C.slateDark);
    g.add(box(3.2, 2.0, 2.4, C.plaster, -5.6, 0, 0.6, 27));     // demo theatre annex
    g.add(prism(3.4, 0.9, 2.6, C.verdigris, -5.6, 2.0, 0.6, 28));
    windowsRow(g, w, 2, 0, 1.0, 1.82, -6.3, 1.4, 0, [0.6, 0.6]);
    roofGarden(g, 5.4, 0, 1.8, 1.8, 1.6, 29);

  },
  business(g, w) {
    g.add(box(6.4, 3.6, 5, C.plaster, 0, 0, 0, 31));
    g.add(box(6.6, 0.3, 5.2, C.slateDark, 0, 3.6, 0, 32));
    windowsRow(g, w, 4, 0, 2.4, 2.52, -2.25, 1.5, 0, [1.2, 0.9]);
    const wall = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 1.1), new THREE.MeshStandardMaterial({ color: "#1b2a33", emissive: "#3f9f8c", emissiveIntensity: 0.35 }));
    wall.position.set(0, 1.0, 2.52); g.add(wall); w.push(wall); wall.userData.wall = true;
    g.add(cyl(0.06, 0.09, 3.2, C.slateDark, 2.3, 3.9, -1.6, 6, 33));
    g.add(box(0.9, 0.1, 0.1, C.slateDark, 2.3, 6.6, -1.6, 34));
    door(g, -2.6, 2.52, 0.9, 1.6, C.slateDark);

    for (const m of w) { m.material = m.material.clone(); m.material.color.set("#d7dfe0"); }  // frosted: private rooms

    for (let i = 0; i < 5; i++) g.add(box(0.9, 0.7, 0.6, C.hedge, -2.2 + i * 1.1, 0, 2.8, 53 + i, 0.12));

  },

    for (let i = 0; i < 6; i++) g.add(box(0.5, 0.35, 0.5, i % 2 ? "#e59a6b" : "#e8c66a", -2.6 + i * 0.5, 0, 3.0, 64 + i, 0.15));  // flower bed
    g.add(tree(-3.4, -1.0, 1.1, 66)); g.add(tree(3.2, 1.4, 0.9, 67));

  },
  postoffice(g, w) {
    g.add(box(4.4, 3, 3.6, C.sand, 0, 0, 0, 71));

    door(g, 0, 1.86, 1.2, 1.9, C.timber);

    const flag = box(0.9, 0.55, 0.04, C.verdigris, 3.06, 3.85, 1.4, 75); g.add(flag);
    g.add(box(0.45, 0.8, 0.4, "#b3372f", -2.7, 0, 1.6, 76));    // post box

/* ---------------------------------------------------------------- dynamic layer: labels, agents, couriers, notes */
const labelLayer = document.createElement("div"); labelLayer.className = "labels"; document.body.appendChild(labelLayer);
const labels = [];
function label(text, obj, offY, cls = "") {
  const el = document.createElement("button"); el.className = "label " + cls; el.textContent = text; el.tabIndex = -1;
  labelLayer.appendChild(el); const L = { el, obj, offY }; labels.push(L); return L;
}
function personMesh(color, parcel = false) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(paint(new THREE.CylinderGeometry(0.22, 0.3, 0.75, 8), color, 0.08, hash(color)), vmat);
  body.position.y = 0.38; body.castShadow = true; g.add(body);
  const head = new THREE.Mesh(paint(new THREE.SphereGeometry(0.2, 10, 8), "#f0d2b1", 0.05, 3), vmat);
  head.position.y = 0.95; head.castShadow = true; g.add(head);
  if (parcel) { const p = box(0.38, 0.3, 0.3, "#c79a5b", 0, 0.55, 0.3, 9); g.add(p); g.userData.parcel = p; }
  return g;
}

let STATE = null, placeById = {};
const agents = new Map(), couriers = new Map();
const noteMeshes = [];

function doorWorld(pid) { const b = BUILD[pid]; return b ? b.door.clone() : new THREE.Vector3(); }
function route(a, b) {   // door -> edge of square -> door
  const A = doorWorld(a), B = doorWorld(b), mid = (p) => p.clone().setLength(Math.min(p.length(), 6.2)).setY(0);
  return [A, mid(A), mid(B), B];
}
function along(pts, t) {
  const seg = [], total = pts.slice(1).reduce((s, p, i) => { const l = p.distanceTo(pts[i]); seg.push(l); return s + l; }, 0);
  let d = t * total;
  for (let i = 0; i < seg.length; i++) { if (d <= seg[i]) return [pts[i].clone().lerp(pts[i + 1], d / (seg[i] || 1)), pts[i + 1].clone().sub(pts[i])]; d -= seg[i]; }
  return [pts[pts.length - 1].clone(), new THREE.Vector3(0, 0, 1)];
}

function buildTown(places) {
  for (const p of places) {
    placeById[p.id] = p;
    if (BUILD[p.id]) continue;
    const g = new THREE.Group(), w = [];
    const doorLocal = (builders[p.id] || builders.office)(g, w);
    g.position.set(p.x, 0, p.z);
    g.rotation.y = Math.atan2(-p.x, -p.z);           // face the square
    g.traverse(o => { if (o.isMesh) { o.userData.place = p.id; PICK.push(o); } });
    scene.add(g);
    const door = new THREE.Vector3(doorLocal[0], 0, doorLocal[1]).applyEuler(new THREE.Euler(0, g.rotation.y, 0)).add(g.position);
    BUILD[p.id] = { group: g, windows: w, door };
    path(door.x * 0.98, door.z * 0.98, door.x / door.length() * 6.3, door.z / door.length() * 6.3);
    BUILD[p.id].label = label(p.name, g, p.id === "office" ? 4.4 : p.id === "library" ? 7.4 : 5.6, "place");
    BUILD[p.id].label.el.onclick = () => select("place", p.id);
  }
  const r = rng(0.31);   // trees and lamps around the edges
  for (let i = 0; i < 140; i++) {
    const a = r() * Math.PI * 2, d = 12 + r() * 46, x = Math.cos(a) * d, z = Math.sin(a) * d;
    if (places.some(p => Math.hypot(p.x - x, p.z - z) < 7.5) || Math.hypot(x, z) < 9) continue;
    scene.add(tree(x, z, 0.8 + r() * 0.6, r()));
  }
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * Math.PI * 2 + 0.3, x = Math.cos(a) * 6.9, z = Math.sin(a) * 6.9;
    scene.add(cyl(0.06, 0.08, 2.2, C.slateDark, x, 0, z, 6, i));
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 6), new THREE.MeshStandardMaterial({ color: "#fff3d6", emissive: C.lamp, emissiveIntensity: 0 }));
    bulb.position.set(x, 2.3, z); scene.add(bulb); lampBulbs.push(bulb);
  }
}
const lampBulbs = [];

function syncAgents(list) {
  const seen = new Set();
  list.filter(a => a.active).forEach((a, idx) => {
    seen.add(a.name);
    let A = agents.get(a.name);
    if (!A) {
      const color = a.color || AGENT_COLORS[Math.floor(hash(a.name) * AGENT_COLORS.length)];
      const mesh = personMesh(color); mesh.userData = { kind: "agent", id: a.name };
      mesh.traverse(o => { if (o.isMesh) { o.userData = { kind: "agent", id: a.name }; PICK.push(o); } });
      scene.add(mesh);
      const d = doorWorld(a.place), off = (hash(a.name) - 0.5) * 2.4;
      mesh.position.copy(d).add(new THREE.Vector3(off, 0, 1.2 + hash(a.name + "z")));
      A = { mesh, data: a, walk: null, label: label(a.name, mesh, 1.6, "agent" + (a.waiting_on ? " waiting" : "")) };
      A.label.el.onclick = () => select("agent", a.name);
      agents.set(a.name, A);
    } else if (A.data.place !== a.place) {
      const pts = route(A.data.place, a.place); pts[0] = A.mesh.position.clone();
      const off = (hash(a.name) - 0.5) * 2.4; pts[pts.length - 1].add(new THREE.Vector3(off, 0, 1.2));
      A.walk = { pts, t: 0, speed: 1 / (pts.reduce((s, p, i) => i ? s + p.distanceTo(pts[i - 1]) : s, 0) / 2.2) };
      if (reduceMotion) { A.mesh.position.copy(pts[pts.length - 1]); A.walk = null; }
    }
    A.data = a;
    A.label.el.className = "label agent" + (a.waiting_on ? " waiting" : "");
  });
  for (const [n, A] of agents) if (!seen.has(n)) { scene.remove(A.mesh); A.label.el.remove(); labels.splice(labels.indexOf(A.label), 1); agents.delete(n); }
}

function syncCouriers(list) {
  const seen = new Set();
  for (const c of list) {
    if (!BUILD[c.from] || !BUILD[c.to] || c.from === c.to) continue;
    seen.add(c.id);
    let K = couriers.get(c.id);
    if (!K) {
      const mesh = personMesh(c.kind === "document" ? "#7d8f9c" : "#c4a36a", true);
      mesh.traverse(o => { if (o.isMesh) { o.userData = { kind: "courier", id: c.id }; PICK.push(o); } });
      scene.add(mesh);
      K = { mesh, data: c, pts: route(c.from, c.to), t: hash(c.id), dir: 1 };
      couriers.set(c.id, K);
    }
    K.data = c;
    K.mesh.userData.parcel.material = mat(c.overdue ? "#b3372f" : "#c79a5b");
  }
  for (const [id, K] of couriers) if (!seen.has(id)) { scene.remove(K.mesh); couriers.delete(id); }
}

function syncNotes(notes) {
  for (const m of noteMeshes) scene.remove(m); noteMeshes.length = 0;
  const b = BUILD.office; if (!b) return;
  notes.slice(0, 9).forEach((n, i) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(0.32, 0.26), new THREE.MeshStandardMaterial({ color: n.overdue ? "#f2c6bd" : "#fbf6ea", emissive: "#fff4d8", emissiveIntensity: 0.15, side: THREE.DoubleSide }));
    m.position.set(-1.35 + (i % 3) * 0.42, 0.85 + Math.floor(i / 3) * 0.33, 1.5); m.rotation.z = (hash(n.title) - 0.5) * 0.3;
    m.userData = { kind: "place", id: "office", place: "office" };
    b.group.add(m); noteMeshes.push(m); PICK.push(m);
  });
}

/* ---------------------------------------------------------------- light that follows the real clock */
const SKY = [ // hour, sky, sun colour, sun strength, hemisphere strength, window glow
  [0, "#26324a", "#9fb0dd", 0.7, 0.75, 1.0], [5, "#323b58", "#a9a0c8", 0.75, 0.75, 0.9], [6.5, "#e8b98f", "#ffc792", 1.3, 0.7, 0.45],
  [9, "#bcd3dc", "#fff2d9", 2.3, 0.95, 0.12], [16, "#c7d6d8", "#fff0d0", 2.2, 0.95, 0.15], [18, "#ebbd8b", "#ffb877", 1.7, 0.75, 0.45],
  [19.5, "#7f6f8e", "#e7957a", 1.0, 0.8, 0.8], [21, "#2b3650", "#a3b3e0", 0.75, 0.75, 1.0], [24, "#26324a", "#9fb0dd", 0.7, 0.75, 1.0],
];
let glowBase = 0.2;
function daylight() {
  const d = new Date(), q = new URLSearchParams(location.search).get("hour"), h = q !== null ? +q : d.getHours() + d.getMinutes() / 60;
  let i = 0; while (SKY[i + 1][0] < h) i++;
  const [h0, s0, c0, k0, e0, g0] = SKY[i], [h1, s1, c1, k1, e1, g1] = SKY[i + 1], t = (h - h0) / (h1 - h0);
  const col = (a, b) => new THREE.Color(a).lerp(new THREE.Color(b), t);
  scene.background = col(s0, s1);
  scene.fog = new THREE.Fog(scene.background, 70, 140);
  sun.color = col(c0, c1); sun.intensity = k0 + (k1 - k0) * t; hemi.intensity = e0 + (e1 - e0) * t;
  glowBase = g0 + (g1 - g0) * t;
  const a = (h - 6) / 12 * Math.PI;           // sun arc east -> west
  sun.position.set(Math.cos(a) * 40 + target.x, Math.max(8, Math.sin(a) * 45), -18 + target.z); sun.target.position.copy(target);
  for (const b of lampBulbs) b.material.emissiveIntensity = glowBase > 0.5 ? 2.2 : 0;
}

function applyGlow() {
  for (const p of STATE.places) {
    const b = BUILD[p.id]; if (!b) continue;
    const busy = Math.min(1, p.activity / 4), on = p.live ? glowBase * 1.4 + busy * 0.9 : glowBase * 0.25;
    for (const w of b.windows) {
      if (w.userData.wall) { w.material.emissiveIntensity = p.live ? 0.4 + busy : 0.08; continue; }
      w.material.emissiveIntensity = on * (0.6 + hash(w.uuid) * 0.6);
    }
    b.label.el.classList.toggle("dim", !p.live);
    b.label.el.classList.toggle("attention", p.attention > 0);
    b.label.el.dataset.count = p.attention || "";
  }
}

/* ---------------------------------------------------------------- data */
async function load(first = false) {
  let s;
  try { s = await (await fetch("/api/v1/kingdom" + (first ? "?visit=1" : ""))).json(); }
  catch { return; }
  STATE = s;
  buildTown(s.places);
  syncAgents(s.agents); syncCouriers(s.couriers); syncNotes(s.notes);
  daylight(); applyGlow(); rail(); clocks();
  if (first && s.since) since(s.since);
  if (selected) select(selected.kind, selected.id, true);
}

function rail() {
  $("rail").innerHTML = "<h2>Places</h2>" + STATE.places.map(p =>
    `<button data-p="${p.id}" class="${p.live ? "" : "dim"}${selected && selected.id === p.id ? " on" : ""}">
       <span>${esc(p.name)}</span>${p.attention ? `<em>${p.attention}</em>` : p.agents.length ? `<i>${p.agents.length}</i>` : ""}</button>`).join("")
    + (STATE.agents.length ? "<h2>People</h2>" + STATE.agents.map(a =>
      `<button data-a="${esc(a.name)}" class="${a.active ? "" : "dim"}"><span>${esc(a.name)}</span><small>${esc(placeById[a.place]?.name || "")}</small></button>`).join("") : "");
  $("rail").querySelectorAll("[data-p]").forEach(b => b.onclick = () => { select("place", b.dataset.p); flyTo(b.dataset.p); });
  $("rail").querySelectorAll("[data-a]").forEach(b => b.onclick = () => select("agent", b.dataset.a));
}

function fmtIn(m) { if (m == null) return ""; if (m < 60) return `in ${m} min`; const h = Math.floor(m / 60); return `in ${h} h ${m % 60 ? (m % 60) + " min" : ""}`.trim(); }
function clocks() {
  const c = STATE.clocks, t = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  for (const [k, nx] of [["work", c.next_work], ["personal", c.next_personal]]) {
    const el = $(k === "work" ? "clockWork" : "clockPersonal");
    el.querySelector(".t").textContent = t;
    el.querySelector(".n").textContent = c.feeds ? (nx ? `${nx.title} ${fmtIn(nx.in_minutes)}` : "Nothing else today") : "Add a calendar";
    drawFace(k, k === "work" ? "Work" : "Personal", t, nx);
  }
}

/* ---------------------------------------------------------------- panels */
let selected = null;
function select(kind, id, refresh = false) {
  selected = { kind, id };
  const body = $("panelBody");
  if (kind === "place") body.innerHTML = placePanel(placeById[id]);
  else if (kind === "agent") body.innerHTML = agentPanel(STATE.agents.find(a => a.name === id));
  else if (kind === "courier") body.innerHTML = courierPanel(STATE.couriers.find(c => c.id === id));
  else if (kind === "clock") body.innerHTML = clockPanel(id);
  $("panel").hidden = false;
  body.querySelectorAll("[data-overlay]").forEach(b => b.onclick = () => select("clock", b.dataset.overlay));
  if (!refresh) rail();
}
$("panelClose").onclick = () => { $("panel").hidden = true; selected = null; rail(); };

function placePanel(p) {

  let h = `<p class="kicker">${esc(p.feel)}</p><h1>${esc(p.name)}</h1>`;
  if (p.private) h += `<p class="private">Private. The map only shows that this office needs attention; participant details stay inside an authorised workspace.</p>`;
  if (p.lines.length) h += `<ul class="lines">${p.lines.map(l => `<li>${esc(l)}</li>`).join("")}</ul>`;
  if (p.id === "office") h += STATE.notes.length ? `<h2>Waiting on you</h2><ul class="notes">${STATE.notes.map(n =>
      `<li class="${n.overdue ? "late" : ""}"><a href="${esc(n.link)}">${esc(n.title)}</a><small>${esc(n.from)}</small></li>`).join("")}</ul>`
    : `<p>Nothing is waiting on you.</p>`;
  if (ags.length) h += `<h2>Here now</h2><ul class="people">${ags.map(a => `<li><button data-agent="${esc(a.name)}">${esc(a.name)}</button> ${esc(a.task || "")}</li>`).join("")}</ul>`;

  h += `<a class="enter" href="${esc(p.enter)}">Go inside</a>`;
  setTimeout(() => $("panelBody").querySelectorAll("[data-agent]").forEach(b => b.onclick = () => select("agent", b.dataset.agent)));

}

function since(s) {
  const m = s.moved, total = Object.values(m).reduce((a, b) => a + b, 0);
  const ago = Math.round((Date.now() - new Date(s.since.replace(" ", "T"))) / 36e5);
  if (ago < 6 && !s.overdue.length) return;
  const parts = [m.sources && `${m.sources} new source${m.sources > 1 ? "s" : ""}`, m.versions && `${m.versions} release${m.versions > 1 ? "s" : ""}`,
    m.decisions && `${m.decisions} decision${m.decisions > 1 ? "s" : ""}`, m.tasks_done && `${m.tasks_done} action${m.tasks_done > 1 ? "s" : ""} done`].filter(Boolean);
  $("since").innerHTML = `<button class="close" aria-label="Close">×</button>
    <h2>Since you were last here <small>${ago < 1 ? "earlier today" : ago < 48 ? ago + " hours ago" : Math.round(ago / 24) + " days ago"}</small></h2>
    <p>${parts.length ? parts.join(" · ") : "Nothing moved."}</p>
    ${s.items.length ? `<ul>${s.items.slice(0, 6).map(i => `<li><a href="${esc(i.link)}">${esc(i.what)}</a></li>`).join("")}</ul>` : ""}
    ${s.stalled.length ? `<h3>Stalled</h3><ul>${s.stalled.map(t => `<li>${esc(t.what)} <small>${esc(t.owner)}</small></li>`).join("")}</ul>` : ""}
    ${s.overdue.length ? `<h3>Overdue handoffs</h3><ul>${s.overdue.map(h => `<li><a href="/kingdom/handoff/${h.id}">${esc(h.what)}</a></li>`).join("")}</ul>` : ""}
    ${STATE.notes.length ? `<p><a href="/kingdom/place/office">${STATE.notes.length} decision${STATE.notes.length > 1 ? "s" : ""} waiting at your office</a></p>` : ""}`;
  $("since").hidden = false;
  $("since").querySelector(".close").onclick = () => $("since").hidden = true;
}

/* ---------------------------------------------------------------- jump to anything */
let jumpItems = [];
function openJump() { $("jumpbox").hidden = false; $("jumpInput").value = ""; $("jumpInput").focus(); runJump(""); }
function closeJump() { $("jumpbox").hidden = true; }
let jumpTimer;
async function runJump(q) {
  const ql = q.toLowerCase(), items = [];
  for (const p of STATE.places) if (!q || p.name.toLowerCase().includes(ql)) items.push({ t: p.name, k: "Place", go: () => { select("place", p.id); flyTo(p.id); } });
  for (const a of STATE.agents) if (q && a.name.toLowerCase().includes(ql)) items.push({ t: a.name, k: "Person", go: () => select("agent", a.name) });
  for (const p of STATE.places) for (const x of p.projects) if (q && x.name.toLowerCase().includes(ql)) items.push({ t: x.name, k: "Project", href: `/library/e/${x.slug}` });
  for (const c of STATE.couriers) if (q && c.what.toLowerCase().includes(ql)) items.push({ t: c.what, k: "Handoff", href: c.link });
  jumpItems = items.slice(0, 8); drawJump();
  clearTimeout(jumpTimer);
  if (q.length > 1) jumpTimer = setTimeout(async () => {
    try {
      const r = await (await fetch("/api/v1/search?limit=8&q=" + encodeURIComponent(q))).json();
      const hits = (r.results || r.hits || r || []).slice ? (r.results || r.hits || r) : [];
      const seenHit = new Set();
      for (const h of hits.slice(0, 20)) { const key = h.url || h.title; if (seenHit.has(key) || seenHit.size >= 8) continue; seenHit.add(key); jumpItems.push({ t: h.name || h.title || h.ref, k: h.kind ? "Library · " + h.kind : "Library", href: h.link || h.url || (h.slug ? `/library/e/${h.slug}` : "/library?q=" + encodeURIComponent(q)) }); }
      drawJump();
    } catch {}
  }, 180);
}
function drawJump() {
  $("jumpList").innerHTML = jumpItems.map((it, i) => `<li role="option" data-i="${i}" class="${i === 0 ? "on" : ""}"><span>${esc(it.t)}</span><small>${esc(it.k)}</small></li>`).join("")
    || `<li class="empty">Nothing matches. Press Enter to search the library.</li>`;
  $("jumpList").querySelectorAll("li[data-i]").forEach(li => li.onclick = () => go(+li.dataset.i));
}
function go(i) { const it = jumpItems[i]; closeJump(); if (!it) return location.href = "/library?q=" + encodeURIComponent($("jumpInput").value); it.href ? location.href = it.href : it.go(); }
$("jumpBtn").onclick = openJump;
$("jumpInput").oninput = e => runJump(e.target.value);
$("jumpInput").onkeydown = e => { if (e.key === "Enter") go(0); if (e.key === "Escape") closeJump(); };
$("jumpbox").onclick = e => { if (e.target.id === "jumpbox") closeJump(); };
for (const id of ["clockWork", "clockPersonal"]) $(id).onclick = () => select("clock", $(id).dataset.clock);

/* ---------------------------------------------------------------- camera: drag to pan, wheel to zoom, Q/E to turn */
let drag = null, moved = 0;
const canvas = renderer.domElement;
canvas.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY }; moved = 0; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", e => {
  if (!drag) { hover(e); return; }
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; moved += Math.abs(dx) + Math.abs(dy);
  drag = { x: e.clientX, y: e.clientY };
  const k = VIEW / innerHeight / camera.zoom, f = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)), r = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  target.addScaledVector(r, -dx * k).addScaledVector(f, dy * k * 1.4); clampTarget(); placeCamera();
});
canvas.addEventListener("pointerup", e => { if (moved < 6) click(e); drag = null; });
canvas.addEventListener("wheel", e => { e.preventDefault(); camera.zoom = Math.min(3.2, Math.max(0.55, camera.zoom * (e.deltaY > 0 ? 0.9 : 1.1))); camera.updateProjectionMatrix(); }, { passive: false });
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "/" || (e.key === "k" && (e.ctrlKey || e.metaKey))) { e.preventDefault(); openJump(); }
  if (e.key === "q" || e.key === "Q") yawGoal += Math.PI / 2;
  if (e.key === "e" || e.key === "E") yawGoal -= Math.PI / 2;
  if (e.key === "Escape") { $("panel").hidden = true; selected = null; }
});
function clampTarget() { const l = Math.hypot(target.x, target.z); if (l > 30) target.multiplyScalar(30 / l); }
let flyGoal = null;
function flyTo(pid) { const p = placeById[pid]; if (p) flyGoal = new THREE.Vector3(p.x * 0.8, 0, p.z * 0.8); }
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
function pickAt(e) {
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(PICK, false)[0]; return hit ? hit.object.userData : null;
}
let hovered = null;
function hover(e) {
  const u = pickAt(e), key = u ? (u.kind || "place") + ":" + (u.id || u.place) : null;
  canvas.style.cursor = u ? "pointer" : "grab";
  if (key === hovered) return; hovered = key;
  for (const b of Object.values(BUILD)) b.label.el.classList.remove("hot");
  if (u && (u.place || u.kind === "place") && BUILD[u.place || u.id]) BUILD[u.place || u.id].label.el.classList.add("hot");
}
function click(e) {
  const u = pickAt(e); if (!u) return;
  if (u.kind === "agent") select("agent", u.id);
  else if (u.kind === "courier") select("courier", u.id);
  else if (u.kind === "clock") select("clock", u.id);
  else if (u.place) select("place", u.place);
}
addEventListener("resize", () => {
  renderer.setSize(innerWidth, innerHeight);
  Object.assign(camera, { left: -VIEW * aspect() / 2, right: VIEW * aspect() / 2 }); camera.updateProjectionMatrix();
});

/* ---------------------------------------------------------------- loop */
const v = new THREE.Vector3(), clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
  if (Math.abs(yawGoal - yaw) > 0.001) { yaw += (yawGoal - yaw) * Math.min(1, dt * 6); placeCamera(); }
  if (flyGoal) { target.lerp(flyGoal, Math.min(1, dt * 4)); placeCamera(); if (target.distanceTo(flyGoal) < 0.05) flyGoal = null; }
  for (const A of agents.values()) {
    if (A.walk) {
      A.walk.t = Math.min(1, A.walk.t + dt * A.walk.speed);
      const [p, dir] = along(A.walk.pts, A.walk.t); A.mesh.position.copy(p); A.mesh.rotation.y = Math.atan2(dir.x, dir.z);
      A.mesh.position.y = Math.abs(Math.sin(t * 9)) * 0.08; if (A.walk.t >= 1) A.walk = null;
    } else if (!reduceMotion) A.mesh.position.y = Math.sin(t * 2 + hash(A.data.name) * 6) * 0.02;
  }
  for (const K of couriers.values()) {
    if (reduceMotion) { const [p] = along(K.pts, 0.5); K.mesh.position.copy(p); continue; }
    K.t += dt * 0.06 * K.dir; if (K.t > 1) { K.t = 1; K.dir = -1; } if (K.t < 0) { K.t = 0; K.dir = 1; }
    const [p, dir] = along(K.pts, K.t); K.mesh.position.copy(p); K.mesh.position.y = Math.abs(Math.sin(t * 8)) * 0.06;
    K.mesh.rotation.y = Math.atan2(dir.x * K.dir, dir.z * K.dir);
  }
  renderer.render(scene, camera);
  for (const L of labels) {
    L.obj.getWorldPosition(v); v.y += L.offY; v.project(camera);
    const on = v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1;
    L.el.style.display = on ? "" : "none";
    if (on) L.el.style.transform = `translate(${(v.x + 1) / 2 * innerWidth}px, ${(1 - v.y) / 2 * innerHeight}px) translate(-50%, -100%)`;
  }
  requestAnimationFrame(frame);
}
await load(true);
setInterval(load, 10000);
setInterval(() => { daylight(); STATE && applyGlow(); }, 60000);
setTimeout(() => $("hint").classList.add("gone"), 9000);
frame();
</script>
